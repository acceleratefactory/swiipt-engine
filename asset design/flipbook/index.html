<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no"/>
<title>Every Night, Just Me — Read as Magazine</title>
<script src="assets/vendor/page-flip.browser.js"></script>
<style>
@font-face{ font-family:'Inter'; src:url('assets/fonts/Inter-Regular.ttf'); font-weight:400; }
@font-face{ font-family:'Inter'; src:url('assets/fonts/Inter-Medium.ttf'); font-weight:500; }
@font-face{ font-family:'Inter'; src:url('assets/fonts/Inter-SemiBold.ttf'); font-weight:600; }
@font-face{ font-family:'Inter'; src:url('assets/fonts/Inter-Bold.ttf'); font-weight:700; }
@font-face{ font-family:'DM Serif Display'; src:url('assets/fonts/DMSerifDisplay-Regular.ttf'); font-weight:400; }

:root{
  --navy:#0B1F33; --purple:#6F35B5; --gold:#D9A52E; --blush:#F3C7D2;
  --ink:#17212B; --muted:#9AA7B4; --line:rgba(255,255,255,0.12);
}
*{ box-sizing:border-box; }
html,body{ margin:0; height:100%; font-family:'Inter',sans-serif; background:var(--navy); overflow:hidden; }

body{
  display:flex; flex-direction:column;
  background:
    radial-gradient(circle at 90% 8%, rgba(217,165,46,0.16) 0%, rgba(217,165,46,0) 42%),
    radial-gradient(circle at 6% 94%, rgba(111,53,181,0.30) 0%, rgba(111,53,181,0) 46%),
    var(--navy);
}

/* ---------- Top bar ---------- */
.topbar{
  flex:0 0 auto; display:flex; align-items:center; justify-content:space-between;
  padding:12px 20px; border-bottom:1px solid var(--line); z-index:20;
}
.brand{ display:flex; align-items:center; gap:10px; color:#fff; }
.brand .tt{ display:flex; flex-direction:column; line-height:1.15; }
.brand .tt b{ font-size:13px; letter-spacing:.02em; }
.brand .tt span{ font-size:10.5px; color:var(--muted); }
.brand svg{ flex-shrink:0; }

.top-actions{ display:flex; align-items:center; gap:8px; }
.btn{
  display:inline-flex; align-items:center; gap:6px; border:none; cursor:pointer;
  font-family:inherit; font-size:12.5px; font-weight:600; padding:8px 14px; border-radius:20px;
  transition:transform .12s ease, opacity .12s ease;
}
.btn:active{ transform:scale(0.96); }
.btn-ghost{ background:rgba(255,255,255,0.08); color:#fff; border:1px solid var(--line); }
.btn-ghost:hover{ background:rgba(255,255,255,0.14); }
.btn-gold{ background:var(--gold); color:var(--navy); }
.btn-gold:hover{ opacity:.92; }

/* ---------- Stage ---------- */
.stage{
  flex:1 1 auto; position:relative; display:flex; align-items:center; justify-content:center;
  padding:14px 70px 10px 70px; min-height:0;
}
#book{ box-shadow:0 30px 70px rgba(0,0,0,0.45); }
.stf__parent{ margin:0 auto; }

.side-nav{
  position:absolute; top:50%; transform:translateY(-50%);
  width:46px; height:46px; border-radius:50%; border:1px solid var(--line);
  background:rgba(255,255,255,0.06); color:#fff; display:flex; align-items:center; justify-content:center;
  cursor:pointer; z-index:15; transition:background .15s ease, transform .15s ease;
}
.side-nav:hover{ background:rgba(255,255,255,0.16); }
.side-nav:active{ transform:translateY(-50%) scale(0.92); }
.side-nav.prev{ left:16px; }
.side-nav.next{ right:16px; }
.side-nav.disabled{ opacity:.25; pointer-events:none; }

/* ---------- Bottom bar ---------- */
.bottombar{
  flex:0 0 auto; display:flex; align-items:center; justify-content:center; gap:16px;
  padding:12px 20px 16px 20px; z-index:20;
}
.progress-wrap{ display:flex; flex-direction:column; align-items:center; gap:6px; min-width:280px; }
.progress-track{ width:100%; max-width:420px; height:4px; border-radius:3px; background:rgba(255,255,255,0.14); position:relative; cursor:pointer; }
.progress-fill{ position:absolute; left:0; top:0; height:100%; border-radius:3px; background:var(--gold); transition:width .25s ease; }
.page-indicator{ font-size:11.5px; color:var(--muted); letter-spacing:.02em; }
.page-indicator b{ color:#fff; font-weight:700; }

.icon-btn{
  width:38px; height:38px; border-radius:50%; border:1px solid var(--line); background:rgba(255,255,255,0.06);
  color:#fff; display:flex; align-items:center; justify-content:center; cursor:pointer; flex-shrink:0;
  transition:background .15s ease;
}
.icon-btn:hover{ background:rgba(255,255,255,0.16); }

/* ---------- TOC drawer ---------- */
.toc-overlay{
  position:fixed; inset:0; background:rgba(11,31,51,0.72); backdrop-filter:blur(2px);
  display:none; align-items:center; justify-content:center; z-index:50;
}
.toc-overlay.open{ display:flex; }
.toc-panel{
  background:#fff; border-radius:16px; width:min(560px, 90vw); max-height:80vh; overflow-y:auto;
  padding:8px 0; box-shadow:0 30px 80px rgba(0,0,0,0.5);
}
.toc-head{ display:flex; align-items:center; justify-content:space-between; padding:16px 22px 10px 22px; border-bottom:1px solid #EEE; }
.toc-head b{ font-size:15px; color:var(--navy); font-family:'DM Serif Display',serif; font-weight:400; font-size:19px;}
.toc-close{ cursor:pointer; color:#9AA7B4; background:none; border:none; font-size:20px; line-height:1;}
.toc-list{ padding:6px 10px; }
.toc-row{
  display:flex; align-items:center; gap:12px; padding:9px 12px; border-radius:10px; cursor:pointer; text-align:left;
  width:100%; background:none; border:none; font-family:inherit;
}
.toc-row:hover{ background:#F4F6F8; }
.toc-row .n{ font-family:'DM Serif Display',serif; color:var(--gold); font-size:14px; width:22px; flex-shrink:0; }
.toc-row .t{ font-size:12.5px; font-weight:600; color:var(--navy); }

/* ---------- Hint ---------- */
.hint{
  position:absolute; bottom:86px; left:50%; transform:translateX(-50%);
  background:rgba(11,31,51,0.9); color:#fff; font-size:11.5px; padding:8px 16px; border-radius:20px;
  border:1px solid var(--line); opacity:1; transition:opacity .6s ease; pointer-events:none; z-index:16; white-space:nowrap;
}
.hint.hidden{ opacity:0; }

@media (max-width:720px){
  .stage{ padding:8px 14px 4px 14px; }
  .side-nav{ width:38px; height:38px; }
  .brand .tt span{ display:none; }
  .btn span.lbl{ display:none; }
  .progress-wrap{ min-width:160px; }
}
</style>
</head>
<body>

  <div class="topbar">
    <div class="brand">
      <svg width="24" height="24" viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
        <rect x="10" y="46" width="40" height="40" rx="10" transform="rotate(45 30 66)" fill="#FFFFFF"/>
        <rect x="50" y="6" width="40" height="40" rx="10" transform="rotate(45 70 26)" fill="#D9A52E"/>
        <path d="M42 54 L58 38" stroke="#D9A52E" stroke-width="5" stroke-linecap="round" opacity="0.9"/>
      </svg>
      <div class="tt"><b>Every Night, Just Me</b><span>Read as Magazine &middot; Complete System</span></div>
    </div>
    <div class="top-actions">
      <a class="btn btn-ghost" href="../app/index.html">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="5" y="2" width="14" height="20" rx="2"/><line x1="12" y1="18" x2="12.01" y2="18"/></svg>
        <span class="lbl">Open App</span>
      </a>
      <a class="btn btn-ghost" href="../read.html">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M2 3h6a4 4 0 0 1 4 4v14a3 3 0 0 0-3-3H2z"/><path d="M22 3h-6a4 4 0 0 0-4 4v14a3 3 0 0 1 3-3h7z"/></svg>
        <span class="lbl">Read</span>
      </a>
      <button class="btn btn-ghost" id="tocBtn">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="8" y1="6" x2="21" y2="6"/><line x1="8" y1="12" x2="21" y2="12"/><line x1="8" y1="18" x2="21" y2="18"/><line x1="3" y1="6" x2="3.01" y2="6"/><line x1="3" y1="12" x2="3.01" y2="12"/><line x1="3" y1="18" x2="3.01" y2="18"/></svg>
        <span class="lbl">Contents</span>
      </button>
      <button class="btn btn-ghost" id="fsBtn">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M8 3H5a2 2 0 0 0-2 2v3m18 0V5a2 2 0 0 0-2-2h-3m0 18h3a2 2 0 0 0 2-2v-3M3 16v3a2 2 0 0 0 2 2h3"/></svg>
        <span class="lbl">Fullscreen</span>
      </button>
      <a class="btn btn-gold" href="assets/Every-Night-Just-Me-V06.pdf" download>
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>
        <span class="lbl">Download PDF</span>
      </a>
    </div>
  </div>

  <div class="stage">
    <div class="side-nav prev" id="prevBtn" aria-label="Previous page">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 18 9 12 15 6"/></svg>
    </div>
    <div id="book"></div>
    <div class="side-nav next" id="nextBtn" aria-label="Next page">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 18 15 12 9 6"/></svg>
    </div>
    <div class="hint" id="hint">Drag a corner or tap the arrows to turn the page</div>
  </div>

  <div class="bottombar">
    <div class="icon-btn" id="firstBtn" title="First page">
      <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="19 20 9 12 19 4 19 20"/><line x1="5" y1="19" x2="5" y2="5"/></svg>
    </div>
    <div class="progress-wrap">
      <div class="progress-track" id="progressTrack"><div class="progress-fill" id="progressFill"></div></div>
      <div class="page-indicator">Page <b id="curPage">1</b> of <b id="totPage">24</b></div>
    </div>
    <div class="icon-btn" id="lastBtn" title="Last page">
      <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="5 4 15 12 5 20 5 4"/><line x1="19" y1="5" x2="19" y2="19"/></svg>
    </div>
  </div>

  <div class="toc-overlay" id="tocOverlay">
    <div class="toc-panel">
      <div class="toc-head"><b>Contents</b><button class="toc-close" id="tocClose">&times;</button></div>
      <div class="toc-list" id="tocList"></div>
    </div>
  </div>

<script>
const TOTAL_PAGES = 24;
const pages = [];
for (let i = 1; i <= TOTAL_PAGES; i++) {
  pages.push('assets/pages/page-' + String(i).padStart(2,'0') + '.jpg');
}

const toc = [
  [1,"Cover"],[2,"Product Identity"],[3,"Contents"],[4,"The Roadmap"],[5,"Before You Begin"],
  [6,"01 — The Read"],[7,"02 — Situation Finder"],[8,"03 — Decision Tree"],[9,"04 — Safety Rules"],
  [10,"05 — Roster A"],[11,"05 — Roster B"],[12,"05 — Roster C"],[13,"06 — Sleep Banker"],
  [14,"07 — Script Cards 1–2"],[15,"07 — Script Cards 3–4"],[16,"07 — Script Cards 5–6"],[17,"07 — Script Card 7"],
  [18,"08 — Fridge Chart"],[19,"09 — 14-Day Tracker"],[20,"10 — Rescue Card"],[21,"11 — Re-entry Protocol"],
  [22,"12 — Safety Gate"],[23,"13 — Authoring Standard"],[24,"Closing"]
];

document.getElementById('totPage').textContent = TOTAL_PAGES;
const tocList = document.getElementById('tocList');
toc.forEach(([n, t]) => {
  const b = document.createElement('button');
  b.className = 'toc-row';
  b.innerHTML = '<span class="n">' + String(n).padStart(2,'0') + '</span><span class="t">' + t + '</span>';
  b.onclick = () => { pageFlip.turnToPage(n-1); closeToc(); };
  tocList.appendChild(b);
});

function computeSize(){
  const stage = document.querySelector('.stage');
  const maxW = Math.min(stage.clientWidth - 140, 1500);
  const maxH = stage.clientHeight - 20;
  let h = maxH;
  let w = h * 0.7071;
  if (w * 2 > maxW) { w = maxW / 2; h = w / 0.7071; }
  return { w: Math.max(220, Math.floor(w)), h: Math.max(310, Math.floor(h)) };
}
const sz = computeSize();

const pageFlip = new St.PageFlip(document.getElementById('book'), {
  width: sz.w,
  height: sz.h,
  size: 'stretch',
  minWidth: 220,
  maxWidth: 900,
  minHeight: 310,
  maxHeight: 1270,
  showCover: true,
  usePortrait: true,
  mobileScrollSupport: false,
  maxShadowOpacity: 0.5,
  flippingTime: 700,
  autoSize: true
});
pageFlip.loadFromImages(pages);

function updateUI(pageIndex){
  const cur = pageIndex + 1;
  document.getElementById('curPage').textContent = cur;
  document.getElementById('progressFill').style.width = (cur/TOTAL_PAGES*100) + '%';
  document.getElementById('prevBtn').classList.toggle('disabled', cur <= 1);
  document.getElementById('nextBtn').classList.toggle('disabled', cur >= TOTAL_PAGES);
}
pageFlip.on('flip', (e) => updateUI(e.data));
updateUI(0);

document.getElementById('prevBtn').onclick = () => pageFlip.flipPrev();
document.getElementById('nextBtn').onclick = () => pageFlip.flipNext();
document.getElementById('firstBtn').onclick = () => pageFlip.turnToPage(0);
document.getElementById('lastBtn').onclick = () => pageFlip.turnToPage(TOTAL_PAGES-1);

document.getElementById('progressTrack').addEventListener('click', (e) => {
  const rect = e.currentTarget.getBoundingClientRect();
  const pct = (e.clientX - rect.left) / rect.width;
  const target = Math.min(TOTAL_PAGES-1, Math.max(0, Math.round(pct * (TOTAL_PAGES-1))));
  pageFlip.turnToPage(target);
});

document.addEventListener('keydown', (e) => {
  if (e.key === 'ArrowRight') pageFlip.flipNext();
  if (e.key === 'ArrowLeft') pageFlip.flipPrev();
  if (e.key === 'Escape') closeToc();
});

// Fullscreen
document.getElementById('fsBtn').onclick = () => {
  if (!document.fullscreenElement) document.documentElement.requestFullscreen();
  else document.exitFullscreen();
};

// TOC
function openToc(){ document.getElementById('tocOverlay').classList.add('open'); }
function closeToc(){ document.getElementById('tocOverlay').classList.remove('open'); }
document.getElementById('tocBtn').onclick = openToc;
document.getElementById('tocClose').onclick = closeToc;
document.getElementById('tocOverlay').addEventListener('click', (e) => { if (e.target.id === 'tocOverlay') closeToc(); });

// Hint auto-hide
setTimeout(() => document.getElementById('hint').classList.add('hidden'), 4200);

// Resize handling
window.addEventListener('resize', () => {
  // page-flip's internal ResizeObserver handles reflow via stretch mode
});
</script>
</body>
</html>
