<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1920" viewBox="0 0 1080 1920"><rect width="1080" height="1920" fill="#0B1F33"/><text x="72" y="200" font-family="Inter, sans-serif" font-size="30" font-weight="600" fill="#D9A52E" letter-spacing="2">PROBLEM</text><foreignObject x="72" y="260" width="936" height="1400"><div xmlns="http://www.w3.org/1999/xhtml" style="font-family:Inter,sans-serif;color:#FFFFFF;font-size:46px;line-height:1.35;font-weight:600">Every uninterrupted hour he gets feels like proof her exhaustion is invisible, and naming it makes her the difficult one. 'Can you help more?' produced a one-off gesture, not a system.</div></foreignObject></svg>