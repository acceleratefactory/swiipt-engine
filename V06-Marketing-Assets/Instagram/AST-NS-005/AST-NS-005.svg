<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1080" viewBox="0 0 1080 1080"><!-- swiipt social design | design=DES-NS-003 family=TYPE_DOMINANT variant=A_LEFT_EDITORIAL tokens=swt-tokens.css@1.x compositor=1.0 --><rect x="0" y="0" width="1080" height="1080" fill="#0B1F33"/><rect x="80" y="120" width="200" height="8" fill="#D9A52E"/><text x="80" y="164" font-family="'DM Serif Display', Georgia, serif" font-size="44" font-weight="400" fill="#17212B" text-anchor="start"><tspan x="80" dy="0">The real cost of the night argument is</tspan><tspan x="80" dy="52">not the lost sleep. It is the resentment</tspan><tspan x="80" dy="52">that stays awake long after the baby</tspan><tspan x="80" dy="52">sleeps.</tspan></text><text x="80" y="636" font-family="Inter, Helvetica, Arial, sans-serif" font-size="28" font-weight="400" fill="#52606D" text-anchor="start"><tspan x="80" dy="0">Resentment builds when one parent always carries the night. The</tspan><tspan x="80" dy="45">other partner is not lazy — they just never got a system.</tspan></text><rect x="80" y="912" width="160" height="40" fill="none" stroke="#DDE2E7" stroke-dasharray="4 4"/><text x="80" y="942" font-family="Inter, Helvetica, Arial, sans-serif" font-size="22" font-weight="600" fill="#17212B" text-anchor="start"><tspan x="80" dy="0">Swiipt</tspan></text></svg>