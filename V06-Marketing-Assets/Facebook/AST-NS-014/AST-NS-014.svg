<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1080" viewBox="0 0 1080 1080"><!-- swiipt social design | design=DES-NS-011 family=TYPE_DOMINANT variant=A_LEFT_EDITORIAL tokens=swt-tokens.css@1.x compositor=1.0 --><rect x="0" y="0" width="1080" height="1080" fill="#0B1F33"/><rect x="80" y="120" width="200" height="8" fill="#D9A52E"/><text x="80" y="164" font-family="'DM Serif Display', Georgia, serif" font-size="44" font-weight="400" fill="#17212B" text-anchor="start"><tspan x="80" dy="0">The roster is not a promise that the</tspan><tspan x="80" dy="52">baby will sleep. It is a plan for what</tspan><tspan x="80" dy="52">happens when the baby wakes.</tspan></text><text x="80" y="636" font-family="Inter, Helvetica, Arial, sans-serif" font-size="28" font-weight="400" fill="#52606D" text-anchor="start"><tspan x="80" dy="0">You cannot control the baby. You can control who gets up. That</tspan><tspan x="80" dy="45">is the only thing a night system actually fixes.</tspan></text><rect x="80" y="912" width="160" height="40" fill="none" stroke="#DDE2E7" stroke-dasharray="4 4"/><text x="80" y="942" font-family="Inter, Helvetica, Arial, sans-serif" font-size="22" font-weight="600" fill="#17212B" text-anchor="start"><tspan x="80" dy="0">Swiipt</tspan></text></svg>